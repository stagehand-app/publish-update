name: 'Stagehand: publish update'
description: Vend a scoped EXPO_TOKEN from Stagehand, run `eas update --branch <resolved> --message <commit subject>`, and report the resulting update group(s) back to Stagehand.
author: Stagehand

branding:
  icon: upload-cloud
  color: purple

inputs:
  project-id:
    description: Stagehand project UUID this workflow publishes for.
    required: true
  stagehand-token:
    description: Stagehand project token used to vend an EXPO_TOKEN and POST the resulting update.
    required: true
  stagehand-api-base:
    description: Override the Stagehand API base URL. Defaults to https://api.stagehand.app.
    required: false
    default: https://api.stagehand.app
  working-directory:
    description: Subdirectory of the repo (relative to the checkout root) where the EAS project lives. Use this for monorepos where app.json/eas.json sit under e.g. apps/mobile. Defaults to the checkout root.
    required: false
  message:
    description: Message attached to the EAS update. Defaults to the latest commit's subject line; pass this input to override.
    required: false

runs:
  using: node24
  main: dist/index.js
